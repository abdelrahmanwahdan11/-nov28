name: health_ai_checkup
description: Pastel health dashboard & AI checkup app inspired by the provided design screenshots.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.22.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  iconly: ^1.0.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
